version: "3.9"

services:
  algo_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-algo}
      - DB_USER=${DB_USER:-algo}
      - DB_PASSWORD=${DB_PASSWORD:-algo}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - IMU_SAMPLE_RATE=${IMU_SAMPLE_RATE:-50}
      - WINDOW_SECONDS=${WINDOW_SECONDS:-3}
      - WINDOW_OVERLAP=${WINDOW_OVERLAP:-0.5}
      - FETCH_INTERVAL_MIN=${FETCH_INTERVAL_MIN:-15}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_weights:/app/weights
    networks:
      - algo_net

  postgres:
    image: postgres:16-alpine
    container_name: algo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-algo}
      POSTGRES_USER: ${DB_USER:-algo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-algo}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-algo} -d ${DB_NAME:-algo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algo_net

volumes:
  pg_data:
  model_weights:

networks:
  algo_net:
    driver: bridge
