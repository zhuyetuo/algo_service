version: "3.9"

services:
  algo_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_service
    restart: unless-stopped
    ports:
      - "8383:8383"
    environment:
      - DB_HOST=${DB_HOST:-192.168.33.253}
      - DB_PORT=${DB_PORT:-30100}
      - DB_NAME=${DB_NAME:-algo}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Hicc-pet-mysql-2026}
      - BIZ_SCHEMA=${BIZ_SCHEMA:-hiccpet_petos}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - IMU_SAMPLE_RATE=${IMU_SAMPLE_RATE:-25}
      - WINDOW_SECONDS=${WINDOW_SECONDS:-2.0}
      - WINDOW_OVERLAP=${WINDOW_OVERLAP:-0.5}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.0}
      - SMOOTH_WINDOW=${SMOOTH_WINDOW:-5}
      - IMU_DEVICE_ACC_UNIT=${IMU_DEVICE_ACC_UNIT:-ms2}
      - IMU_DEVICE_GYRO_UNIT=${IMU_DEVICE_GYRO_UNIT:-dps}
      - IMU_MODEL_ACC_UNIT=${IMU_MODEL_ACC_UNIT:-ms2}
      - IMU_MODEL_GYRO_UNIT=${IMU_MODEL_GYRO_UNIT:-dps}
      - VERBOSE_INFERENCE=${VERBOSE_INFERENCE:-false}
      - FETCH_INTERVAL_SEC=${FETCH_INTERVAL_SEC:-15}
      - TD_HOST=${TD_HOST:-192.168.33.253}
      - TD_PORT=${TD_PORT:-6041}
      - TD_USER=${TD_USER:-root}
      - TD_PASSWORD=${TD_PASSWORD:-taosdata}
      - TD_DATABASE=${TD_DATABASE:-hiccpet_device}
      - TD_SUPERTABLE=${TD_SUPERTABLE:-imu_data}
      # label_infra 对接：容器内 NAS 挂载点固定 /nas，宿主机路径由 NAS_HOST_PATH 指定
      - NAS_ROOT=/nas
      - IMU_TRAIN_REPO_DIR=${IMU_TRAIN_REPO_DIR:-imu_train}
      - LABEL_INFRA_CALLBACK_URL=${LABEL_INFRA_CALLBACK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      # 跟 label_infra 后端挂同一份 NAS（宿主机上的 ai_data 目录），/infer、/train 只传相对路径
      - ${NAS_HOST_PATH:-/home/toky/ai_data}:/nas
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
