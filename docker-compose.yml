version: "3.9"

services:
  algo_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-192.168.33.253}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-algo}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Hicc-mysql-2026}
      - BIZ_SCHEMA=${BIZ_SCHEMA:-hiccpet_petos}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - IMU_SAMPLE_RATE=${IMU_SAMPLE_RATE:-20}
      - WINDOW_SECONDS=${WINDOW_SECONDS:-2.0}
      - WINDOW_OVERLAP=${WINDOW_OVERLAP:-0.5}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.6}
      - FETCH_INTERVAL_SEC=${FETCH_INTERVAL_SEC:-15}
      - TD_HOST=${TD_HOST:-192.168.33.253}
      - TD_PORT=${TD_PORT:-6041}
      - TD_USER=${TD_USER:-root}
      - TD_PASSWORD=${TD_PASSWORD:-taosdata}
      - TD_DATABASE=${TD_DATABASE:-hiccpet_device}
      - TD_SUPERTABLE=${TD_SUPERTABLE:-imu_data}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
